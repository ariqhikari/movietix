name: MovieTix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codebase-audit:
    name: Codebase & Architecture Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Architecture & Codebase Consistency Audit
        run: |
          chmod +x scripts/audit_codebase.sh
          ./scripts/audit_codebase.sh

      - name: Verify WCAG 2.1 Contrast Ratios
        run: |
          chmod +x scripts/calculate_contrast.py
          python3 scripts/calculate_contrast.py

  android-build-and-test:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    needs: codebase-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Android Shared Tests
        run: |
          chmod +x ./kotlin
          ./kotlin test -p android -m shared

      - name: Build Android App (Release Verification)
        run: |
          ./kotlin build -m androidApp

  ios-build-and-test:
    name: iOS Build & Unit Tests
    runs-on: macos-14
    needs: codebase-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run iOS Simulator Shared Tests
        run: |
          chmod +x ./kotlin
          ./kotlin test -p iosSimulatorArm64 -m shared

      - name: Build iOS App with Xcode
        run: |
          xcodebuild -project iosApp/module.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO
